version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: okf_rag_postgres
    restart: always
    environment:
      POSTGRES_USER: okf_user
      POSTGRES_PASSWORD: okf_password
      POSTGRES_DB: okf_rag
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okf_user -d okf_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: okf_rag_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
